[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-perf-bench"
version = "0.1.0"
description = "A benchmarking framework for measuring RAG pipeline latency, throughput, and performance."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
]