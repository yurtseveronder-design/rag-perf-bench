name: RAG Performance & Quality Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-benchmark deepeval openai

    - name: Run RAG Benchmark Test Suite
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python -m pytest tests/test_bench.py -v

    - name: Upload Performance Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rag-performance-report
        path: performance_report.md